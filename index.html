<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Corg Universe</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #f8f9fa, #e2e6ea);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .form-container {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
      }

      h2 {
        text-align: center;
        color: #333;
        margin-bottom: 25px;
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
        color: #444;
      }

      input[type="text"],
      input[type="tel"],
      input[type="email"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        transition: border-color 0.3s ease;
      }

      input:focus {
        border-color: #007bff;
        outline: none;
      }

      .radio-group {
        margin-bottom: 20px;
      }

      .radio-group input {
        margin-right: 10px;
      }

      input[type="submit"] {
        background-color: #007bff;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        transition: background-color 0.3s ease;
      }

      input[type="submit"]:hover {
        background-color: #0056b3;
      }

      @media (max-width: 500px) {
        .form-container {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Provide Us Your Details</h2>
      <form id="userForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required />

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll" required />

        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" required />

        <label for="mcq">Choose an answer:</label>
        <div class="radio-group">
          <input
            type="radio"
            name="mcq"
            value="FullStack
          Developer"
            required
          />
          FullStack Developer<br />
          <input type="radio" name="mcq" value="Data Analyst" /> Data Analyst<br />
          <input type="radio" name="mcq" value="Data Science Engineer" /> Data
          Science Engineer<br />
          <input type="radio" name="mcq" value="Backend Engineer" /> Backend
          Engineer
        </div>

        <input type="submit" value="Submit" />
      </form>
    </div>

    <script>
      const form = document.getElementById("userForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
          const response = await fetch("http://localhost:8000/submit", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          if (response.ok) {
            Swal.fire({
              icon: "success",
              title: "Email Sent",
              text: "Check your inbox for the OTP!",
            });
            form.reset();
          } else {
            const result = await response.json();
            Swal.fire({
              icon: "error",
              title: "Submission Failed",
              text: result.detail || "Something went wrong. Try again!",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Error",
            text: "Could not reach the server.",
          });
        }
      });
    </script>
  </body>
</html>
